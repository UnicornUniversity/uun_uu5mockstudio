<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uu5Mock Studio demo</title>
<meta name="description" content="Silent demo of uu5Mock Studio: AI-driven prototyping of uu5 / uuGDS user interfaces.">
<style>
  :root { --bg:#f4f6fb; --fg:#1b2030; --mute:#5b6478; --acc:#2f6df6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151d; --fg:#e8ecf5; --mute:#97a0b5; --acc:#7aa2ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p { color:var(--mute); margin:0 0 20px; }
  video { width:100%; border-radius:14px; background:#000; box-shadow:0 12px 40px rgba(20,30,70,.25); }
  a { color:var(--acc); }
  footer { margin-top:20px; font-size:14px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>uu5Mock Studio</h1>
  <p>AI-driven prototyping of uu5 / uuGDS user interfaces. A silent demo of about 3.5 minutes. The update notice in the video is simulated.</p>
  <video src="demo.mp4" controls preload="metadata" playsinline></video>
  <footer><a href="https://github.com/UnicornUniversity/uun_uu5mockstudio">Source and downloads on GitHub</a> · uu5Mock Studio by Marek Beránek, Unicorn University</footer>
</main>
</body>
</html>
