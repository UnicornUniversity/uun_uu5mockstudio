<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report</title>
    <!-- A content page made of uu5Bricks only: it is meant to be copied as uu5String into a document (uuBookKit page, uuManagementKit portal). -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = { uu5bricksg01: "1.x", "uu5chartsg01-bricks": "3.x", "uu5tilesg02-bricks": "2.x" };
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls {
        display: none;
      }
      body {
        margin: 0;
      }
      /* the width of a document page; the document gives its own frame, so this is not part of the uu5String */
      #uu5 {
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import * as Uu5Bricks from "uu5bricksg01";
      import * as Uu5ChartsBricks from "uu5chartsg01-bricks";
      import * as Uu5TilesBricks from "uu5tilesg02-bricks";

      function Page() {
        return (
          <>
            <Uu5Bricks.Section header="Sales report, Q3 2026" headerType="heading" level={1}>
              <p>Results of the third quarter compared with the plan.</p>
              <Uu5Bricks.InfoGroup size="l">
                <Uu5Bricks.InfoGroup.Item title="€ 1.24 M" subtitle="Revenue" />
                <Uu5Bricks.InfoGroup.Item title="108 %" subtitle="Of the plan" />
                <Uu5Bricks.InfoGroup.Item title="342" subtitle="New customers" />
                <Uu5Bricks.InfoGroup.Item title="4.6 / 5" subtitle="Satisfaction" />
              </Uu5Bricks.InfoGroup>
            </Uu5Bricks.Section>

            <Uu5Bricks.Layout type="tiles" minTileWidth={360}>
              <Uu5Bricks.Layout.Item>
                <Uu5Bricks.Card header="Revenue by month (k€)">
                  <Uu5ChartsBricks.XyChart
                    data={[
                      { month: "July", revenue: 380, plan: 370 },
                      { month: "August", revenue: 395, plan: 380 },
                      { month: "September", revenue: 465, plan: 400 },
                    ]}
                    serieList={[
                      { valueKey: "revenue", title: "Revenue", bar: true },
                      { valueKey: "plan", title: "Plan" },
                    ]}
                    labelAxis={{ dataKey: "month" }}
                    legend
                  />
                </Uu5Bricks.Card>
              </Uu5Bricks.Layout.Item>
              <Uu5Bricks.Layout.Item>
                <Uu5Bricks.Card header="Revenue by region">
                  <Uu5ChartsBricks.PieChart
                    data={[[
                      { name: "North", value: 480 },
                      { name: "Centre", value: 410 },
                      { name: "South", value: 350 },
                    ]]}
                    serieList={[{ valueKey: "value", labelKey: "name", title: "Regions" }]}
                    legend
                  />
                </Uu5Bricks.Card>
              </Uu5Bricks.Layout.Item>
            </Uu5Bricks.Layout>

            <Uu5Bricks.Section header="Top products" headerType="heading" level={2}>
              <Uu5TilesBricks.Table
                columnList={[{ header: "Product" }, { header: "Units" }, { header: "Revenue" }]}
                data={[
                  ["Trail backpack 30 l", "1 240", "€ 110 k"],
                  ["City jacket", "860", "€ 95 k"],
                  ["Hiking boots", "610", "€ 88 k"],
                ]}
              />
            </Uu5Bricks.Section>

            <Uu5Bricks.InfoBlock>
              <p><strong>Summary.</strong> September made up for a weak summer; the South region stays behind the plan.</p>
            </Uu5Bricks.InfoBlock>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
