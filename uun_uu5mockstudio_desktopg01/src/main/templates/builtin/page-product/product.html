<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product detail</title>
    <!-- A content page made of uu5Bricks only: it is meant to be copied as uu5String into a document (uuBookKit page, uuManagementKit portal). -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = { uu5bricksg01: "1.x", "uu5imagingg01-bricks": "2.x", "uu5tilesg02-bricks": "2.x" };
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls {
        display: none;
      }
      body {
        margin: 0;
      }
      /* the width of a document page; the document gives its own frame, so this is not part of the uu5String */
      #uu5 {
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import * as Uu5Bricks from "uu5bricksg01";
      import * as Uu5ImagingBricks from "uu5imagingg01-bricks";
      import * as Uu5TilesBricks from "uu5tilesg02-bricks";

      const IMG = "https://uuapp.plus4u.net/uu-webkit-maing02/b6d739b46b0a4f4980891c3c54a6df5d/image-placeholder-";

      function Page() {
        return (
          <>
            <Uu5Bricks.Layout type="tiles" minTileWidth={360}>
              <Uu5Bricks.Layout.Item>
                <Uu5ImagingBricks.Image src={`${IMG}09`} alt="Trail backpack 30 l" aspectRatio="4x3" />
              </Uu5Bricks.Layout.Item>
              <Uu5Bricks.Layout.Item>
                <Uu5Bricks.Section header="Trail backpack 30 l" headerType="heading" level={1}>
                  <p>
                    <Uu5Bricks.Badge colorScheme="green">New</Uu5Bricks.Badge>
                  </p>
                  <p>A light backpack for one-day trips: a back that breathes, a rain cover in the bottom pocket and room for a 2 l bottle.</p>
                  <Uu5Bricks.InfoGroup>
                    <Uu5Bricks.InfoGroup.Item icon="uugds-tag" title="€ 89" subtitle="Price" />
                    <Uu5Bricks.InfoGroup.Item icon="uugds-check-circle" title="In stock" subtitle="Availability" />
                    <Uu5Bricks.InfoGroup.Item icon="uugds-shield-check" title="3 years" subtitle="Warranty" />
                  </Uu5Bricks.InfoGroup>
                  <Uu5Bricks.Link type="button" colorScheme="primary" significance="highlighted" href="https://uuapp.plus4u.net" target="_blank">
                    Order
                  </Uu5Bricks.Link>
                </Uu5Bricks.Section>
              </Uu5Bricks.Layout.Item>
            </Uu5Bricks.Layout>

            <Uu5Bricks.Section header="Gallery" headerType="heading" level={2}>
              <Uu5ImagingBricks.Gallery>
                <Uu5ImagingBricks.Gallery.Item src={`${IMG}02`} alt="On the trail" />
                <Uu5ImagingBricks.Gallery.Item src={`${IMG}05`} alt="Detail of the back" />
                <Uu5ImagingBricks.Gallery.Item src={`${IMG}09`} alt="Side pockets" />
              </Uu5ImagingBricks.Gallery>
            </Uu5Bricks.Section>

            <Uu5Bricks.Tabs>
              <Uu5Bricks.Tabs.Item label="Description" icon="uugds-info">
                <p>Made of recycled nylon with a water-repellent finish. The hip belt can be taken off for city use.</p>
              </Uu5Bricks.Tabs.Item>
              <Uu5Bricks.Tabs.Item label="Specifications" icon="uugds-checkbox-list">
                <Uu5TilesBricks.Table
                  columnList={[{ header: "Parameter" }, { header: "Value" }]}
                  data={[
                    ["Volume", "30 l"],
                    ["Weight", "850 g"],
                    ["Dimensions", "52 × 30 × 20 cm"],
                    ["Material", "Recycled nylon"],
                  ]}
                />
              </Uu5Bricks.Tabs.Item>
              <Uu5Bricks.Tabs.Item label="Downloads" icon="uugds-download">
                <ul>
                  <li><Uu5Bricks.Link href="https://uuapp.plus4u.net" target="_blank">User manual (PDF)</Uu5Bricks.Link></li>
                  <li><Uu5Bricks.Link href="https://uuapp.plus4u.net" target="_blank">Care instructions (PDF)</Uu5Bricks.Link></li>
                </ul>
              </Uu5Bricks.Tabs.Item>
            </Uu5Bricks.Tabs>

            <Uu5Bricks.Section header="Questions" headerType="heading" level={2}>
              <Uu5Bricks.Accordion>
                <Uu5Bricks.Accordion.Item header="Does it fit carry-on luggage?">
                  <p>Yes, it fits the carry-on limits of most airlines.</p>
                </Uu5Bricks.Accordion.Item>
                <Uu5Bricks.Accordion.Item header="Can I return it?">
                  <p>Within 30 days, unused and with the tags.</p>
                </Uu5Bricks.Accordion.Item>
              </Uu5Bricks.Accordion>
            </Uu5Bricks.Section>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
