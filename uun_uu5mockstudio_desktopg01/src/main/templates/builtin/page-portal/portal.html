<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal</title>
    <!-- A content page made of uu5Bricks only: it is meant to be copied as uu5String into a document (uuBookKit page, uuManagementKit portal). -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = { uu5bricksg01: "1.x" };
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls {
        display: none;
      }
      body {
        margin: 0;
      }
      /* the width of a document page; the document gives its own frame, so this is not part of the uu5String */
      #uu5 {
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import * as Uu5Bricks from "uu5bricksg01";

      function Page() {
        return (
          <>
            <Uu5Bricks.Background gradient="linear-gradient(-135deg, #008BA1 0%, #00AFCB 100%)" background="full" borderRadius="expressive" padding="c d">
              <Uu5Bricks.Section header="Team portal" headerType="heading" level={1}>
                <p>Everything the team works with in one place: applications, documents, news and the people to ask.</p>
              </Uu5Bricks.Section>
            </Uu5Bricks.Background>

            <Uu5Bricks.Section header="Applications and documents" headerType="heading" level={2}>
              <Uu5Bricks.Layout type="tiles" minTileWidth={240}>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Tile header="Requests" href="https://uuapp.plus4u.net" target="_blank" shape="interactiveElement" borderRadius="moderate" headerSeparator>
                    <p>Submit and track requests of the team.</p>
                  </Uu5Bricks.Tile>
                </Uu5Bricks.Layout.Item>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Tile header="Handbook" href="https://uuapp.plus4u.net" target="_blank" shape="interactiveElement" borderRadius="moderate" headerSeparator>
                    <p>Rules, processes and how-tos.</p>
                  </Uu5Bricks.Tile>
                </Uu5Bricks.Layout.Item>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Tile header="Calendar" href="https://uuapp.plus4u.net" target="_blank" shape="interactiveElement" borderRadius="moderate" headerSeparator>
                    <p>Meetings, holidays and deadlines.</p>
                  </Uu5Bricks.Tile>
                </Uu5Bricks.Layout.Item>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Tile header="Reports" href="https://uuapp.plus4u.net" target="_blank" shape="interactiveElement" borderRadius="moderate" headerSeparator>
                    <p>Monthly results and key numbers.</p>
                  </Uu5Bricks.Tile>
                </Uu5Bricks.Layout.Item>
              </Uu5Bricks.Layout>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="News" headerType="heading" level={2}>
              <Uu5Bricks.VerticalTimeline singleColumn>
                <Uu5Bricks.VerticalTimeline.Item label="5 November">
                  <p><strong>New request form</strong><br />Requests now go through one form with a status you can follow.</p>
                </Uu5Bricks.VerticalTimeline.Item>
                <Uu5Bricks.VerticalTimeline.Item label="28 October">
                  <p><strong>Handbook updated</strong><br />The chapter about onboarding was rewritten.</p>
                </Uu5Bricks.VerticalTimeline.Item>
              </Uu5Bricks.VerticalTimeline>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="Contacts" headerType="heading" level={2}>
              <Uu5Bricks.InfoGroup>
                <Uu5Bricks.InfoGroup.Item title="Jane Doe" subtitle="Team lead" imageSrc="https://cdn.plus4u.net/uu-plus4u5g01/4.0.0/assets/img/anonymous.png" />
                <Uu5Bricks.InfoGroup.Item title="John Smith" subtitle="Operations" imageSrc="https://cdn.plus4u.net/uu-plus4u5g01/4.0.0/assets/img/anonymous.png" />
                <Uu5Bricks.InfoGroup.Item title="help@example.com" subtitle="Helpdesk" icon="uugds-email" href="mailto:help@example.com" />
              </Uu5Bricks.InfoGroup>
            </Uu5Bricks.Section>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
