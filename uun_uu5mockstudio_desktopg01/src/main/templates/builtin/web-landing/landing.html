<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing page</title>
    <!-- A whole web page (header, content, footer) drawn full width: plain HTML and CSS for the look, Uu5Elements.Icon for icons. -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = {};
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls { display: none; }
      body { margin: 0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #1f2933; background: #fff; }
      .w { max-width: 1152px; margin: 0 auto; padding: 0 24px; }
      .nav { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); border-bottom: 1px solid #e4e7eb; }
      .nav .w { display: flex; align-items: center; gap: 28px; height: 64px; }
      .nav .brand { font-weight: 700; font-size: 20px; color: #0b3a8f; margin-right: auto; }
      .nav a { color: #323f4b; text-decoration: none; font-size: 15px; }
      .btn { display: inline-block; padding: 12px 22px; border-radius: 8px; background: #1d5fbf; color: #fff !important; font-weight: 600; text-decoration: none; }
      .btn.ghost { background: transparent; color: #1d5fbf !important; border: 2px solid #1d5fbf; padding: 10px 20px; }
      .sec { padding: 72px 0; }
      .sec.alt { background: #f4f7fb; }
      h1 { font-size: 46px; line-height: 1.12; margin: 0 0 16px; }
      h2 { font-size: 32px; margin: 0 0 12px; }
      h3 { font-size: 19px; margin: 12px 0 6px; }
      p { line-height: 1.6; margin: 0 0 12px; color: #3e4c59; }
      .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 12px; padding: 24px; }
      .foot { background: #0b2447; color: #cbd2d9; padding: 40px 0; font-size: 14px; }
      .foot a { color: #e4e7eb; text-decoration: none; margin-right: 20px; }
      @media (max-width: 700px) { h1 { font-size: 34px; } .nav .links { display: none; } .sec { padding: 48px 0; } }
      .hero { background: linear-gradient(135deg, #0b3a8f 0%, #1d5fbf 100%); color: #fff; padding: 96px 0; text-align: center; }
      .hero h1, .hero p { color: #fff; }
      .hero p { font-size: 20px; max-width: 680px; margin: 0 auto 28px; }
      .hero .btn { background: #fff; color: #0b3a8f !important; }
      .icon { width: 48px; height: 48px; border-radius: 12px; background: #e8f0fc; color: #1d5fbf; display: grid; place-items: center; font-size: 24px; }
      .steps { counter-reset: s; display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .steps .card:before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #1d5fbf; color: #fff; font-weight: 700; margin-bottom: 12px; }
      details { border-bottom: 1px solid #e4e7eb; padding: 16px 0; }
      summary { font-weight: 600; font-size: 17px; cursor: pointer; }
      .cta { text-align: center; }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import Uu5Elements from "uu5g05-elements";
      const IMG = "https://uuapp.plus4u.net/uu-webkit-maing02/b6d739b46b0a4f4980891c3c54a6df5d/image-placeholder-";

      function Page() {
        return (
          <>
            <div className="nav">
              <div className="w">
                <span className="brand">PlanFlow</span>
                <a className="btn" href="#start">Try it free</a>
              </div>
            </div>

            <div className="hero">
              <div className="w">
                <h1>Plan your team's work in minutes, not meetings</h1>
                <p>One shared plan, clear owners and deadlines everyone can see. Free for teams up to ten people.</p>
                <a className="btn" href="#start">Start free for 30 days</a>
              </div>
            </div>

            <div className="sec">
              <div className="w">
                <h2>What you get</h2>
                <div className="grid" style={{ marginTop: 24 }}>
                  {[
                    ["uugds-calendar", "A plan everyone sees", "Tasks, owners and dates on one board, always up to date."],
                    ["uugds-bell", "Reminders that help", "A short nudge a day before a deadline, not a flood of mail."],
                    ["uugdsstencil-chart-bar-chart", "A clear overview", "See at a glance what is late and who has room."],
                  ].map(([icon, title, text]) => (
                    <div className="card" key={title}>
                      <div className="icon"><Uu5Elements.Icon icon={icon} /></div>
                      <h3>{title}</h3>
                      <p>{text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="sec alt">
              <div className="w">
                <h2>How it works</h2>
                <div className="steps" style={{ marginTop: 24 }}>
                  {[
                    ["Create a plan", "Start from a template or an empty board."],
                    ["Invite the team", "Send one link, no installation needed."],
                    ["Work together", "Update tasks, comment and see progress live."],
                  ].map(([title, text]) => (
                    <div className="card" key={title}>
                      <h3>{title}</h3>
                      <p>{text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="sec">
              <div className="w" style={{ maxWidth: 760 }}>
                <h2>Questions</h2>
                <details><summary>Is it really free?</summary><p>Yes, for teams up to ten people. Larger teams pay per person.</p></details>
                <details><summary>Can I import my current plan?</summary><p>You can import a spreadsheet or a list of tasks in one step.</p></details>
                <details><summary>Where is my data stored?</summary><p>In the European Union, and you can export it at any time.</p></details>
              </div>
            </div>

            <div className="sec alt cta" id="start">
              <div className="w">
                <h2>Ready to try it?</h2>
                <p>Create your first plan in under five minutes.</p>
                <a className="btn" href="#">Start free for 30 days</a>
              </div>
            </div>

            <div className="foot">
              <div className="w">
                <p><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></p>
                <p style={{ color: "#9aa5b1" }}>© 2026 PlanFlow</p>
              </div>
            </div>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
