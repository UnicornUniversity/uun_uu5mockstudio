<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing page</title>
    <!-- A content page made of uu5Bricks only: it is meant to be copied as uu5String into a document (uuBookKit page, uuManagementKit portal). -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = { uu5bricksg01: "1.x" };
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls {
        display: none;
      }
      body {
        margin: 0;
      }
      /* the width of a document page; the document gives its own frame, so this is not part of the uu5String */
      #uu5 {
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import * as Uu5Bricks from "uu5bricksg01";

      function Page() {
        return (
          <>
            <Uu5Bricks.InfoCarousel height={420}>
              <Uu5Bricks.InfoCarousel.Item src="https://uuapp.plus4u.net/uu-webkit-maing02/b6d739b46b0a4f4980891c3c54a6df5d/image-placeholder-02">
                <Uu5Bricks.Section header="Plan your team's work in minutes" headerType="heading" level={1}>
                  <p>One place for tasks, deadlines and the people behind them. No setup, no training.</p>
                  <Uu5Bricks.Link type="button" colorScheme="primary" significance="highlighted" href="https://uuapp.plus4u.net" target="_blank">
                    Try it for free
                  </Uu5Bricks.Link>
                </Uu5Bricks.Section>
              </Uu5Bricks.InfoCarousel.Item>
              <Uu5Bricks.InfoCarousel.Item src="https://uuapp.plus4u.net/uu-webkit-maing02/b6d739b46b0a4f4980891c3c54a6df5d/image-placeholder-05">
                <Uu5Bricks.Section header="Everyone sees the same plan" headerType="heading" level={2}>
                  <p>Changes show up for the whole team at once, on any device.</p>
                </Uu5Bricks.Section>
              </Uu5Bricks.InfoCarousel.Item>
            </Uu5Bricks.InfoCarousel>

            <Uu5Bricks.Section header="Why teams choose it" headerType="heading" level={2} headerHorizontalAlignment="center">
              <Uu5Bricks.InfoGroup size="l">
                <Uu5Bricks.InfoGroup.Item icon="uugds-clock" title="Ready in 5 minutes" subtitle="Start from a template" />
                <Uu5Bricks.InfoGroup.Item icon="uugds-account-multi" title="Built for teams" subtitle="Shared plan, clear owners" />
                <Uu5Bricks.InfoGroup.Item icon="uugds-shield-check" title="Secure" subtitle="Your data stays yours" />
              </Uu5Bricks.InfoGroup>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="What you get" headerType="heading" level={2}>
              <Uu5Bricks.Layout type="tiles" minTileWidth={280}>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Card header="Plans and milestones">
                    <p>Break work into milestones and see at a glance what is late.</p>
                  </Uu5Bricks.Card>
                </Uu5Bricks.Layout.Item>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Card header="Reminders">
                    <p>Everyone gets a reminder before a deadline, by e-mail or in the app.</p>
                  </Uu5Bricks.Card>
                </Uu5Bricks.Layout.Item>
                <Uu5Bricks.Layout.Item>
                  <Uu5Bricks.Card header="Reports">
                    <p>A weekly summary of what was done and what is next.</p>
                  </Uu5Bricks.Card>
                </Uu5Bricks.Layout.Item>
              </Uu5Bricks.Layout>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="What our customers say" headerType="heading" level={2}>
              <Uu5Bricks.Blockquote footer="Jane Doe, project manager">
                <p>We stopped chasing status updates. The plan tells us everything.</p>
              </Uu5Bricks.Blockquote>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="Questions" headerType="heading" level={2}>
              <Uu5Bricks.Accordion>
                <Uu5Bricks.Accordion.Item header="How much does it cost?">
                  <p>The basic plan is free for up to 10 people.</p>
                </Uu5Bricks.Accordion.Item>
                <Uu5Bricks.Accordion.Item header="Can I import my data?">
                  <p>Yes, from a spreadsheet or from another tool.</p>
                </Uu5Bricks.Accordion.Item>
              </Uu5Bricks.Accordion>
            </Uu5Bricks.Section>

            <Uu5Bricks.HighlightedBox icon="uugds-check-circle">
              <p><strong>Start today.</strong> Your first plan is ready before your coffee gets cold.</p>
              <Uu5Bricks.Link type="button" colorScheme="primary" significance="highlighted" href="https://uuapp.plus4u.net" target="_blank">
                Create a plan
              </Uu5Bricks.Link>
            </Uu5Bricks.HighlightedBox>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
