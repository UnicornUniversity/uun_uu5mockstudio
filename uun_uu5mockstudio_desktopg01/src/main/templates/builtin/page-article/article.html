<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article</title>
    <!-- A content page made of uu5Bricks only: it is meant to be copied as uu5String into a document (uuBookKit page, uuManagementKit portal). -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = { uu5bricksg01: "1.x", "uu5codekitg01-bricks": "3.x" };
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls {
        display: none;
      }
      body {
        margin: 0;
      }
      /* the width of a document page; the document gives its own frame, so this is not part of the uu5String */
      #uu5 {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import * as Uu5Bricks from "uu5bricksg01";
      import * as Uu5CodeKitBricks from "uu5codekitg01-bricks";

      function Page() {
        return (
          <>
            <Uu5Bricks.Section header="How to connect the reporting service" headerType="heading" level={1}>
              <Uu5Bricks.InfoGroup size="s">
                <Uu5Bricks.InfoGroup.Item icon="uugds-account" title="Jane Doe" subtitle="Author" />
                <Uu5Bricks.InfoGroup.Item icon="uugds-calendar" title="5 November 2026" subtitle="Updated" />
                <Uu5Bricks.InfoGroup.Item icon="uugds-timer" title="10 minutes" subtitle="Reading time" />
              </Uu5Bricks.InfoGroup>
              <p>This guide shows how to connect an application to the reporting service and send the first report.</p>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="Before you start" headerType="heading" level={2}>
              <Uu5Bricks.InfoBlock>
                <p>You need the role <strong>Reporting Admin</strong> and the address of your reporting service.</p>
              </Uu5Bricks.InfoBlock>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="Steps" headerType="heading" level={2}>
              <ol>
                <li>Open the settings of the application.</li>
                <li>Fill in the address of the reporting service.</li>
                <li>Send a test report with the command below.</li>
              </ol>
              <Uu5CodeKitBricks.Code syntax="javascript" minRows={3} value={'await reporting.send({ name: "test", values: [1, 2, 3] });'} />
              <Uu5Bricks.WarningBlock>
                <p>Do not send real data before the test report shows up in the service.</p>
              </Uu5Bricks.WarningBlock>
            </Uu5Bricks.Section>

            <Uu5Bricks.Section header="Troubleshooting" headerType="heading" level={2}>
              <Uu5Bricks.Accordion>
                <Uu5Bricks.Accordion.Item header="The report does not show up">
                  <p>Check that the address ends without a slash and that the role is assigned.</p>
                </Uu5Bricks.Accordion.Item>
                <Uu5Bricks.Accordion.Item header="Access denied">
                  <p>Ask the administrator of the service to add you to the Reporting Admin group.</p>
                </Uu5Bricks.Accordion.Item>
              </Uu5Bricks.Accordion>
            </Uu5Bricks.Section>

            <Uu5Bricks.SuccessBlock>
              <p>Done. The application now sends its reports automatically every night.</p>
            </Uu5Bricks.SuccessBlock>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
