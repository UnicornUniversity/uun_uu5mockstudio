<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product detail</title>
    <!-- A whole web page (header, content, footer) drawn full width: plain HTML and CSS for the look, Uu5Elements.Icon for icons. -->
    <script src="https://cdn.plus4u.net/uu-uu5loaderg01/1.0.0/uu5loaderg01.min.js" crossorigin></script>
    <script>
      var uu5DemoDependencies = {};
    </script>
    <script src="https://cdng02.plus4u.net/b686718ad49d3ec4d88936576cd830c2/uu-uu5g05/1.x/assets/example-config.js" crossorigin></script>
    <style>
      .uu-app-devkit-demo-middleware-controls { display: none; }
      body { margin: 0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #1f2933; background: #fff; }
      .w { max-width: 1152px; margin: 0 auto; padding: 0 24px; }
      .nav { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); border-bottom: 1px solid #e4e7eb; }
      .nav .w { display: flex; align-items: center; gap: 28px; height: 64px; }
      .nav .brand { font-weight: 700; font-size: 20px; color: #0b3a8f; margin-right: auto; }
      .nav a { color: #323f4b; text-decoration: none; font-size: 15px; }
      .btn { display: inline-block; padding: 12px 22px; border-radius: 8px; background: #1d5fbf; color: #fff !important; font-weight: 600; text-decoration: none; }
      .btn.ghost { background: transparent; color: #1d5fbf !important; border: 2px solid #1d5fbf; padding: 10px 20px; }
      .sec { padding: 72px 0; }
      .sec.alt { background: #f4f7fb; }
      h1 { font-size: 46px; line-height: 1.12; margin: 0 0 16px; }
      h2 { font-size: 32px; margin: 0 0 12px; }
      h3 { font-size: 19px; margin: 12px 0 6px; }
      p { line-height: 1.6; margin: 0 0 12px; color: #3e4c59; }
      .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 12px; padding: 24px; }
      .foot { background: #0b2447; color: #cbd2d9; padding: 40px 0; font-size: 14px; }
      .foot a { color: #e4e7eb; text-decoration: none; margin-right: 20px; }
      @media (max-width: 700px) { h1 { font-size: 34px; } .nav .links { display: none; } .sec { padding: 48px 0; } }
      .crumbs { font-size: 14px; color: #52606d; padding: 20px 0 0; }
      .crumbs a { color: #1d5fbf; }
      .prod { display: grid; gap: 48px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 24px 0 72px; align-items: center; }
      .prod img { width: 100%; border-radius: 12px; display: block; }
      .lead { font-size: 20px; color: #323f4b; }
      .tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: #e3f9e5; color: #0e5814; font-size: 13px; font-weight: 600; }
      .price { font-size: 32px; font-weight: 700; color: #1f2933; }
      .price small { font-size: 14px; font-weight: 400; color: #52606d; margin-left: 8px; }
      .spec { border-collapse: collapse; width: 100%; max-width: 560px; }
      .spec td { padding: 10px 0; border-bottom: 1px solid #e4e7eb; }
      .spec td:first-child { color: #52606d; width: 40%; }
      @media (max-width: 860px) { .prod { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="uu5"></div>

    <script type="text/babel">
      import { Utils } from "uu5g05";
      import Uu5Elements from "uu5g05-elements";
      const IMG = "https://uuapp.plus4u.net/uu-webkit-maing02/b6d739b46b0a4f4980891c3c54a6df5d/image-placeholder-";

      function Page() {
        return (
          <>
            <div className="nav">
              <div className="w">
                <span className="brand">Northwind Outdoor</span>
                <span className="links" style={{ display: "flex", gap: 28 }}>
                  <a href="#">Backpacks</a>
                  <a href="#">About us</a>
                  <a href="#">News</a>
                  <a href="#">Contact</a>
                </span>
                <a className="btn" href="#">Shop now</a>
              </div>
            </div>

            <div className="w">
              <div className="crumbs"><a href="#">Home</a> › <a href="#">Backpacks</a> › Trail backpack 30 l</div>
              <div className="prod">
                <img src={IMG + "09"} alt="Trail backpack 30 l" />
                <div>
                  <span className="tag">New</span>
                  <h1>Trail backpack 30 l</h1>
                  <p className="lead">A light backpack for one-day trips: a back that breathes, a rain cover in the bottom pocket and room for a 2 l bottle.</p>
                  <p className="price">€ 89 <small>In stock · delivery in 2 days</small></p>
                  <a className="btn" href="#">Add to cart</a> <a className="btn ghost" href="#">Find a shop</a>
                </div>
              </div>
            </div>

            <div className="sec alt">
              <div className="w">
                <h2>Why you will like it</h2>
                <div className="grid">
                  <div className="card"><h3>Light</h3><p>Only 850 g thanks to recycled nylon.</p></div>
                  <div className="card"><h3>Comfortable</h3><p>A breathing back and a hip belt that can be taken off.</p></div>
                  <div className="card"><h3>3 years warranty</h3><p>If something breaks, we repair or replace it.</p></div>
                </div>
              </div>
            </div>

            <div className="sec">
              <div className="w">
                <h2>Specifications</h2>
                <table className="spec">
                  <tbody>
                    <tr><td>Volume</td><td>30 l</td></tr>
                    <tr><td>Weight</td><td>850 g</td></tr>
                    <tr><td>Dimensions</td><td>52 × 30 × 20 cm</td></tr>
                    <tr><td>Material</td><td>Recycled nylon</td></tr>
                  </tbody>
                </table>
                <h2 style={{ marginTop: 48 }}>Questions</h2>
                <h3>Does it fit carry-on luggage?</h3>
                <p>Yes, it fits the carry-on limits of most airlines.</p>
                <h3>Can I return it?</h3>
                <p>Within 30 days, unused and with the tags.</p>
              </div>
            </div>

            <div className="foot">
              <div className="w">
                <p style={{ color: "#fff", fontWeight: 600 }}>Northwind Outdoor</p>
                <p><a href="#">Backpacks</a><a href="#">About us</a><a href="#">News</a><a href="#">Contact</a></p>
                <p style={{ color: "#9aa5b1" }}>© 2026 Northwind Outdoor. All rights reserved.</p>
              </div>
            </div>
          </>
        );
      }

      Utils.Dom.render(<Page />, document.getElementById("uu5"));
    </script>
  </body>
</html>
